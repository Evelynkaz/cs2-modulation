[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/Evelynkaz/cs2-modulation"

[workspace.dependencies]
s2fmt = { path = "crates/s2fmt" }
geom = { path = "crates/geom" }
extract = { path = "crates/extract" }
sim = { path = "crates/sim" }
solver = { path = "crates/solver" }
calib = { path = "crates/calib" }
server = { path = "crates/server" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
ruzstd = "0.8"
crc32fast = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
