[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
solver = { workspace = true }
sim = { workspace = true }
geom = { workspace = true }
extract = { workspace = true }
radar = { workspace = true }
s2render = { workspace = true }
s2fmt = { workspace = true }
s2tex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
# Only the `Stream` trait, to implement `axum::body::Body::from_stream` by hand over a
# `tokio::sync::mpsc` channel (`s6d_solve_api.md`'s streaming mechanism); already compiled into
# the tree as an `axum-core` dependency, so this adds no new crate to the build.
futures-core = "0.3"

[dev-dependencies]
tower = "0.5"
